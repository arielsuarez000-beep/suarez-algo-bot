name: Range matched exits historical Bybit audit
on:
  push:
    branches:
      - experiment/range-matched-exits
    paths:
      - 'tests/range-matched-exits-historical.cjs'
      - '.github/workflows/range-matched-exits-historical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run 180-day public Bybit matched-exit audit
        run: node tests/range-matched-exits-historical.cjs
      - name: Upload report even when one or more pairs fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: range-matched-exits-historical-${{ github.sha }}
          path: artifacts/range-matched-exits-report.json
          if-no-files-found: warn
          retention-days: 14
