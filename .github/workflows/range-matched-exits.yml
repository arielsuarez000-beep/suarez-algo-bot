name: Range matched exits audit
on:
  push:
    branches:
      - experiment/range-matched-exits
    paths:
      - 'index.html'
      - 'tests/range-matched-exits.test.cjs'
      - 'tests/range-matched-exits-historical.cjs'
      - '.github/workflows/range-matched-exits.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'tests/range-matched-exits.test.cjs'
      - '.github/workflows/range-matched-exits.yml'
permissions:
  contents: read
jobs:
  deterministic-exit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify matched exit replay
        run: node tests/range-matched-exits.test.cjs

  bybit-historical-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run 30-day Bybit public-history audit
        run: node tests/range-matched-exits-historical.cjs
      - name: Publish JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: range-matched-exits-report
          path: artifacts/range-matched-exits-report.json
          if-no-files-found: ignore
